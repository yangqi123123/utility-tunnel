<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>安全预案 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"></head><body data-menu-key="safety.plans" data-page-section="安全管理" data-page-title="安全预案"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="page-head"><div><h1 class="page-title">安全预案</h1><p class="page-desc">统一维护管廊安全生产预案，覆盖编制、审核、修订与发布全流程。</p></div><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增预案</button></section><section class="metric-grid" id="metrics"></section><section class="card filters"><div class="filter-grid"><label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" placeholder="预案编号或名称"></label><label class="form-field"><span class="form-label">预案类型</span><select class="form-control" data-filter="type"><option value="">全部类型</option><option>综合应急</option><option>专项应急</option><option>现场处置</option></select></label><label class="form-field"><span class="form-label">审核状态</span><select class="form-control" data-filter="review"><option value="">全部状态</option><option>草稿</option><option>审核中</option><option>已通过</option><option>已退回</option></select></label><label class="form-field"><span class="form-label">启用状态</span><select class="form-control" data-filter="enabled"><option value="">全部状态</option><option>启用</option><option>停用</option></select></label><div class="filter-actions"><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">查询</button></div></div></section><section class="card"><div class="card-title-row"><div><h2 class="card-title">预案列表</h2><span class="panel-helper">共 <strong id="count">0</strong> 条记录</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>预案编号</th><th>预案名称</th><th>预案类型</th><th>适用范围</th><th>版本号</th><th>责任部门</th><th>负责人</th><th>最近修订</th><th>审核状态</th><th>启用状态</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script>
const seed=[{id:1,code:'SA-2026-001',name:'管廊综合安全生产应急预案',type:'综合应急',scope:'全线管廊',version:'V3.0',department:'安全管理部',owner:'张建国',revisedAt:'2026-08-20',review:'已通过',enabled:'启用',content:'明确火灾、积水、燃气泄漏等综合事件的分级响应和联动处置流程。'},{id:2,code:'SA-2026-002',name:'有限空间作业专项预案',type:'专项应急',scope:'舱室及井室',version:'V2.1',department:'运维中心',owner:'李涛',revisedAt:'2026-07-12',review:'审核中',enabled:'停用',content:'规范有限空间作业审批、监护、通风检测与应急救援。'},{id:3,code:'SA-2026-003',name:'电力故障现场处置方案',type:'现场处置',scope:'电力舱',version:'V1.2',department:'机电班组',owner:'王磊',revisedAt:'2026-05-03',review:'草稿',enabled:'停用',content:'用于电力设备故障的现场隔离、抢修和恢复供电。'}];const key='safety-plans';let data=JSON.parse(localStorage.getItem(key)||'null')||seed;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const tag=(v)=>`<span class="tag ${v==='已通过'||v==='启用'?'success':v==='审核中'?'primary':v==='已退回'?'danger':'warning'}">${esc(v)}</span>`;const byId=id=>data.find(x=>String(x.id)===String(id));function render(list=data){document.getElementById('count').textContent=list.length;document.getElementById('body').innerHTML=list.map(i=>`<tr><td>${esc(i.code)}</td><td><strong>${esc(i.name)}</strong></td><td>${esc(i.type)}</td><td>${esc(i.scope)}</td><td>${esc(i.version)}</td><td>${esc(i.department)}</td><td>${esc(i.owner)}</td><td>${esc(i.revisedAt)}</td><td>${tag(i.review)}</td><td>${tag(i.enabled)}</td><td><button class="table-action" data-row="detail" data-id="${i.id}">详情</button><button class="table-action" data-row="edit" data-id="${i.id}">编辑</button><button class="table-action" data-row="submit" data-id="${i.id}">提交审核</button><button class="table-action" data-row="revise" data-id="${i.id}">修订</button></td></tr>`).join('');document.getElementById('metrics').innerHTML=[['预案总数',data.length,'primary'],['审核中',data.filter(x=>x.review==='审核中').length,'warning'],['已通过',data.filter(x=>x.review==='已通过').length,'success'],['待修订',data.filter(x=>x.enabled==='停用').length,'purple']].map(([a,b,c])=>`<div class="metric-card"><span>${a}</span><strong class="${c}">${b}</strong><small>较上月保持稳定</small></div>`).join('')}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function detail(i){return `<section class="detail-section"><h3 class="detail-title">预案基本信息</h3><div class="detail-grid">${[['预案编号',i.code],['预案名称',i.name],['预案类型',i.type],['适用范围',i.scope],['版本号',i.version],['责任部门',i.department],['负责人',i.owner],['最近修订',i.revisedAt],['审核状态',tag(i.review)],['启用状态',tag(i.enabled)]].map(([a,b])=>`<div class="info-item"><span class="info-label">${a}</span><span class="info-value">${String(b).startsWith('<span')?b:esc(b)}</span></div>`).join('')}</div></section><section class="detail-section"><h3 class="detail-title">预案摘要</h3><p class="detail-text">${esc(i.content)}</p></section>`}function form(i,mode){const v=k=>mode==='create'?'':esc(i[k]);return `<div class="form-grid-2">${[['预案编号','code'],['预案名称','name'],['预案类型','type'],['适用范围','scope'],['版本号','version'],['责任部门','department'],['负责人','owner'],['最近修订','revisedAt']].map(([a,k])=>`<label class="form-field"><span class="form-label">${a}</span><input class="form-control" data-field="${k}" value="${v(k)}" placeholder="请输入${a}"></label>`).join('')}</div><label class="form-field"><span class="form-label">预案摘要</span><textarea class="form-control textarea" data-field="content">${v('content')}</textarea></label>`}function open(mode,i){window.openAppDrawer({title:mode==='create'?'新增安全预案':mode==='edit'?'编辑安全预案':'安全预案详情',subtitle:'安全管理 · 安全预案',body:mode==='detail'?detail(i):form(i,mode),footer:`<button class="btn btn-secondary" data-drawer-close>${mode==='detail'?'关闭':'取消'}</button>${mode==='detail'?'':`<button class="btn btn-primary" data-save-plan="${mode}" data-id="${i?.id||''}">保存</button>`}`})}render();document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='create')open('create',{});if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');render()}if(a==='search'){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));render(data.filter(i=>(!f.keyword||(i.code+i.name).includes(f.keyword))&&(!f.type||i.type===f.type)&&(!f.review||i.review===f.review)&&(!f.enabled||i.enabled===f.enabled)))}const r=e.target.closest('[data-row]');if(!r)return;const i=byId(r.dataset.id);if(r.dataset.row==='detail')open('detail',i);if(r.dataset.row==='edit')open('edit',i);if(r.dataset.row==='submit'){i.review='审核中';save()}if(r.dataset.row==='revise'){i.version='V'+(Number(i.version.replace('V',''))+0.1).toFixed(1);i.review='草稿';i.revisedAt=new Date().toISOString().slice(0,10);save()}});document.addEventListener('click',e=>{const b=e.target.closest('[data-save-plan]');if(!b)return;const fields=Object.fromEntries([...document.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]));if(b.dataset.savePlan==='create')data.unshift({id:Date.now(),...fields,review:'草稿',enabled:'停用'});else Object.assign(byId(b.dataset.id),fields);save();window.closeAppDrawer()});
</script><style>.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric-card{background:#fff;border:1px solid var(--line);padding:18px 20px}.metric-card span,.metric-card small{display:block;color:var(--text-secondary);font-size:12px}.metric-card strong{display:block;font-size:28px;margin:6px 0}.metric-card .primary{color:var(--primary)}.metric-card .warning{color:var(--yellow)}.metric-card .success{color:var(--green)}.metric-card .purple{color:var(--purple)}.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:16px;align-items:end}.filter-actions{display:flex;gap:8px}.table-action{border:0;background:none;color:var(--primary);cursor:pointer;margin-right:10px}.table-action:last-child{color:var(--text-secondary)}@media(max-width:1100px){.filter-grid{grid-template-columns:repeat(2,1fr)}.metric-grid{grid-template-columns:repeat(2,1fr)}}</style></body></html>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const pageHead=document.querySelector('.page-head');
  pageHead?.querySelector('[data-action="create"]')?.remove();
  const card=document.querySelector('.card:not(.filters)');
  const titleRow=card?.querySelector('.card-title-row');
  if(titleRow){ titleRow.classList.add('safety-toolbar'); titleRow.querySelector('.panel-helper')?.remove(); titleRow.insertAdjacentHTML('beforeend','<button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增预案</button>'); }
  const table=card?.querySelector('.table-wrap');
  if(table && !card.querySelector('.pagination')) table.insertAdjacentHTML('afterend','<div class="pagination"><span>共 <strong id="safetyPlanCount">0</strong> 条，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div>');
  const count=document.getElementById('count'), pagerCount=document.getElementById('safetyPlanCount');
  if(count && pagerCount){ const sync=()=>pagerCount.textContent=count.textContent; sync(); new MutationObserver(sync).observe(count,{childList:true}); }
});
</script>
<style>.safety-toolbar{padding:16px 20px;align-items:center}.safety-toolbar .card-title{margin:0}.safety-toolbar .btn{margin-left:auto}.pagination{margin:16px 8px 0}</style>
