<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>法规库 - 科学岛管廊监控中心</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"></head><body data-menu-key="safety.regulations" data-page-section="安全管理" data-page-title="法规库"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="page-head"><div><h1 class="page-title">法规库</h1><p class="page-desc">集中记录国家、地方与公司安全生产法律法规，及时追踪有效性和修订情况。</p></div><button class="btn btn-primary" data-action="create"><i class="fa-solid fa-plus"></i> 新增法规</button></section><section class="card filters"><div class="filter-grid"><label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" placeholder="法规编号或名称"></label><label class="form-field"><span class="form-label">法规层级</span><select class="form-control" data-filter="level"><option value="">全部层级</option><option>国家</option><option>地方</option><option>公司</option></select></label><label class="form-field"><span class="form-label">主题分类</span><select class="form-control" data-filter="topic"><option value="">全部主题</option><option>安全生产</option><option>消防安全</option><option>应急管理</option><option>职业健康</option></select></label><label class="form-field"><span class="form-label">有效状态</span><select class="form-control" data-filter="status"><option value="">全部状态</option><option>有效</option><option>即将失效</option><option>已失效</option></select></label><div class="filter-actions"><button class="btn btn-secondary" data-action="reset">重置</button><button class="btn btn-primary" data-action="search">查询</button></div></div></section><section class="card"><div class="card-title-row"><div><h2 class="card-title">法规清单</h2><span class="panel-helper">共 <strong id="count">0</strong> 条记录</span></div><button class="btn btn-secondary" data-action="export"><i class="fa-solid fa-download"></i> 导出</button></div><div class="table-wrap"><table class="table"><thead><tr><th>法规编号</th><th>法规名称</th><th>法规层级</th><th>发布部门</th><th>发布日期</th><th>生效日期</th><th>主题分类</th><th>适用范围</th><th>有效状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section></div></main></div><script src="../../../app/config/menu.js?v=nav-home-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script><script>
const seed=[{id:1,code:'REG-国家-001',name:'中华人民共和国安全生产法',level:'国家',publisher:'全国人民代表大会常务委员会',publishedAt:'2021-06-10',effectiveAt:'2021-09-01',topic:'安全生产',scope:'全体生产经营单位',status:'有效',updatedAt:'2026-01-08',summary:'确立安全生产工作方针、生产经营单位主体责任和事故应急救援制度。'},{id:2,code:'REG-地方-014',name:'湖北省城市地下管线管理办法',level:'地方',publisher:'湖北省人民政府',publishedAt:'2022-03-18',effectiveAt:'2022-06-01',topic:'安全生产',scope:'湖北省地下管线工程',status:'有效',updatedAt:'2025-12-16',summary:'规范城市地下管线规划、建设、运行维护和信息管理。'},{id:3,code:'REG-公司-006',name:'管廊有限空间作业安全管理规定',level:'公司',publisher:'中建科创安全管理部',publishedAt:'2024-02-01',effectiveAt:'2024-03-01',topic:'职业健康',scope:'管廊运营项目',status:'即将失效',updatedAt:'2026-08-22',summary:'明确有限空间辨识、审批、检测、监护和应急处置要求。'}];const key='safety-regulations';let data=JSON.parse(localStorage.getItem(key)||'null')||seed;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]));const tag=v=>`<span class="tag ${v==='有效'?'success':v==='即将失效'?'warning':'danger'}">${esc(v)}</span>`;const byId=id=>data.find(x=>String(x.id)===String(id));function render(list=data){document.getElementById('count').textContent=list.length;document.getElementById('body').innerHTML=list.map(i=>`<tr><td>${esc(i.code)}</td><td><strong>${esc(i.name)}</strong></td><td>${esc(i.level)}</td><td>${esc(i.publisher)}</td><td>${esc(i.publishedAt)}</td><td>${esc(i.effectiveAt)}</td><td>${esc(i.topic)}</td><td>${esc(i.scope)}</td><td>${tag(i.status)}</td><td>${esc(i.updatedAt)}</td><td><button class="table-action" data-row="detail" data-id="${i.id}">详情</button><button class="table-action" data-row="edit" data-id="${i.id}">编辑</button><button class="table-action" data-row="revise" data-id="${i.id}">修订</button><button class="table-action" data-row="invalidate" data-id="${i.id}">失效</button></td></tr>`).join('')}function save(){localStorage.setItem(key,JSON.stringify(data));render()}function detail(i){return `<section class="detail-section"><h3 class="detail-title">法规基本信息</h3><div class="detail-grid">${[['法规编号',i.code],['法规名称',i.name],['法规层级',i.level],['发布部门',i.publisher],['发布日期',i.publishedAt],['生效日期',i.effectiveAt],['主题分类',i.topic],['适用范围',i.scope],['有效状态',tag(i.status)],['最近更新',i.updatedAt]].map(([a,b])=>`<div class="info-item"><span class="info-label">${a}</span><span class="info-value">${String(b).startsWith('<span')?b:esc(b)}</span></div>`).join('')}</div></section><section class="detail-section"><h3 class="detail-title">内容摘要</h3><p class="detail-text">${esc(i.summary)}</p></section>`}function form(i,mode){const v=k=>mode==='create'?'':esc(i[k]);return `<div class="form-grid-2">${[['法规编号','code'],['法规名称','name'],['法规层级','level'],['发布部门','publisher'],['发布日期','publishedAt'],['生效日期','effectiveAt'],['主题分类','topic'],['适用范围','scope']].map(([a,k])=>`<label class="form-field"><span class="form-label">${a}</span><input class="form-control" data-field="${k}" value="${v(k)}" placeholder="请输入${a}"></label>`).join('')}</div><label class="form-field"><span class="form-label">内容摘要</span><textarea class="form-control textarea" data-field="summary">${v('summary')}</textarea></label>`}function open(mode,i){window.openAppDrawer({title:mode==='create'?'新增法规':mode==='edit'?'编辑法规':'法规详情',subtitle:'安全管理 · 法规库',body:mode==='detail'?detail(i):form(i,mode),footer:`<button class="btn btn-secondary" data-drawer-close>${mode==='detail'?'关闭':'取消'}</button>${mode==='detail'?'':`<button class="btn btn-primary" data-save-reg="${mode}" data-id="${i?.id||''}">保存</button>`}`})}render();document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='create')open('create',{});if(a==='export')window.openAppDrawer({title:'导出法规库',body:'<p>已生成当前筛选条件下的法规清单。</p>',footer:'<button class="btn btn-primary" data-drawer-close>知道了</button>'});if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');render()}if(a==='search'){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));render(data.filter(i=>(!f.keyword||(i.code+i.name).includes(f.keyword))&&(!f.level||i.level===f.level)&&(!f.topic||i.topic===f.topic)&&(!f.status||i.status===f.status)))}const r=e.target.closest('[data-row]');if(!r)return;const i=byId(r.dataset.id);if(r.dataset.row==='detail')open('detail',i);if(r.dataset.row==='edit')open('edit',i);if(r.dataset.row==='revise'){i.updatedAt=new Date().toISOString().slice(0,10);i.status='有效';save()}if(r.dataset.row==='invalidate'){i.status='已失效';i.updatedAt=new Date().toISOString().slice(0,10);save()}});document.addEventListener('click',e=>{const b=e.target.closest('[data-save-reg]');if(!b)return;const fields=Object.fromEntries([...document.querySelectorAll('[data-field]')].map(x=>[x.dataset.field,x.value]));if(b.dataset.saveReg==='create')data.unshift({id:Date.now(),...fields,status:'有效',updatedAt:new Date().toISOString().slice(0,10)});else Object.assign(byId(b.dataset.id),fields);save();window.closeAppDrawer()});
</script><style>.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:16px;align-items:end}.filter-actions{display:flex;gap:8px}.table-action{border:0;background:none;color:var(--primary);cursor:pointer;margin-right:10px}.table-action:last-child{color:var(--text-secondary)}@media(max-width:1100px){.filter-grid{grid-template-columns:repeat(2,1fr)}}</style></body></html>
