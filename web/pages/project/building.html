<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管廊管理 - 中建四局智能运营管理系统</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="../../assets/css/tob-ui.css"><link rel="stylesheet" href="../../assets/css/building-management.css?v=2"></head><body class="building-page" data-menu-key="project.building" data-page-section="项目管理" data-page-title="管廊管理"><div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="screen-frame stack"><section class="card filters building-filters"><div class="filter-actions"><label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" placeholder="搜索管廊编码或名称"></label><label class="form-field"><span class="form-label">管廊类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>综合管廊</option><option>缆线管廊</option></select></label><label class="form-field"><span class="form-label">运行状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>正常运行</option><option>部分运行</option><option>停运</option></select></label><button class="btn btn-ghost" type="button" data-action="collapse">展开 <i class="fa-solid fa-chevron-down"></i></button><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search">搜索</button></div></section><section class="card building-list-card"><div class="card-title-row building-toolbar"><h2 class="card-title">管廊档案</h2><div class="btn-row"><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i> 导出</button><button class="btn btn-danger-outline" type="button" data-action="delete-selected" disabled>删除</button><button class="btn btn-primary" type="button" data-action="create"><i class="fa-solid fa-plus"></i> 新增管廊</button><button class="icon-btn" type="button" title="刷新" data-action="refresh"><i class="fa-solid fa-rotate-right"></i></button></div></div><div class="table-wrap"><table class="table building-table table-actions-sticky" aria-label="管廊档案"><thead><tr><th class="check-cell"><input type="checkbox" data-select-all></th><th>管廊编码</th><th>管廊名称</th><th>所属项目</th><th>管廊类型</th><th>管廊长度（m）</th><th>舱室数量</th><th>区段数量</th><th>管线数量</th><th>设备数量</th><th>运行状态</th><th>责任单位</th><th>管廊负责人</th><th>投运日期</th><th>操作</th></tr></thead><tbody id="buildingTableBody"></tbody></table></div><div class="pagination"><span>共 <strong id="buildingCount">0</strong> 条记录，每页 10 条</span><span class="page-item disabled">‹</span><span class="page-item active">1</span><span class="page-item disabled">›</span></div></section></div></main></div><script src="../../../app/config/menu.js?v=project-2"></script><script src="../../../app/components/sidebar.js?v=project-2"></script><script src="../../../app/components/header.js?v=project-2"></script><script src="../../../app/components/drawer.js"></script><script>
const corridors=[{id:1,code:'TL-DH-001',name:'高新大道综合管廊',project:'光谷科学岛综合开发项目',type:'综合管廊',length:2400,cabins:4,sections:21,pipelines:16,devices:106,status:'正常运行',unit:'光谷科学岛运维中心',manager:'光谷科学岛运维中心',date:'2025-06-30',start:'高新大道西段',end:'光谷一路',level:'A级',section:'矩形断面',structure:'现浇钢筋混凝土',builder:'中建四局',operator:'光谷科学岛运维中心',note:'主干综合管廊，覆盖高新大道沿线。'},{id:2,code:'TL-DH-002',name:'科学岛东段管廊',project:'光谷科学岛综合开发项目',type:'综合管廊',length:1680,cabins:3,sections:12,pipelines:9,devices:54,status:'部分运行',unit:'光谷科学岛运维中心',manager:'光谷科学岛运维中心',date:'2025-03-18',start:'科学岛东入口',end:'科创一路',level:'B级',section:'矩形断面',structure:'现浇钢筋混凝土',builder:'中建四局',operator:'光谷科学岛运维中心',note:'东段分期投入运行。'}];
const body=document.getElementById('buildingTableBody'),count=document.getElementById('buildingCount');let filtered=corridors;const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const tag=v=>`<span class="tag ${v==='正常运行'?'success':v==='部分运行'?'primary':'warning'}">${v}</span>`;function renderRows(list=filtered){filtered=list;body.innerHTML=list.map(i=>`<tr data-building-id="${i.id}"><td class="check-cell"><input type="checkbox" data-building-check></td><td>${esc(i.code)}</td><td>${esc(i.name)}</td><td>${esc(i.project)}</td><td>${esc(i.type)}</td><td>${i.length}</td><td>${i.cabins}</td><td>${i.sections}</td><td>${i.pipelines}</td><td>${i.devices}</td><td>${tag(i.status)}</td><td>${esc(i.unit)}</td><td>${esc(i.manager)}</td><td>${i.date}</td><td><button class="table-action" data-building-action="detail" data-building-id="${i.id}">详情</button><button class="table-action" data-building-action="edit" data-building-id="${i.id}">编辑</button><button class="table-action" data-building-action="cabin-management" data-building-id="${i.id}">舱室管理</button><button class="table-action status-danger" data-building-action="delete" data-building-id="${i.id}">删除</button></td></tr>`).join('');count.textContent=list.length;updateSelection();}const byId=id=>corridors.find(i=>String(i.id)===String(id))||corridors[0];
function detailBody(i){const fields=[['管廊编码',i.code],['管廊名称',i.name],['所属项目',i.project],['管廊类型',i.type],['总长度（m）',i.length],['舱室数量',i.cabins],['区段数量',i.sections],['管线数量',i.pipelines],['设备数量',i.devices],['运行状态',tag(i.status)],['责任单位',i.unit],['管廊负责人',i.manager],['投运日期',i.date],['起点',i.start],['终点',i.end],['设计等级',i.level],['断面类型',i.section],['结构类型',i.structure],['建设单位',i.builder],['运营单位',i.operator]];return `<section class="detail-section"><h3 class="detail-title">管廊信息</h3><div class="detail-grid">${fields.map(([k,v])=>`<div class="info-item"><span class="info-label">${k}</span><span class="info-value">${String(v).startsWith('<span')?v:esc(v)}</span></div>`).join('')}</div></section><section class="detail-section"><h3 class="detail-title">备注</h3><p class="detail-text">${esc(i.note||'-')}</p></section>`;}
function formBody(i,mode){const c=mode==='create',v=k=>c?'':esc(i[k]);return `<div class="form-grid-2">${[['管廊编码','code','text',1],['管廊名称','name','text',1],['所属项目','project','project',1],['管廊类型','type','type',1],['起点','start','text'],['终点','end','text'],['总长度（m）','length','number'],['设计等级','level','level'],['断面类型','section','section'],['结构类型','structure','structure'],['建设单位','builder','text'],['运营单位','operator','text'],['投运日期','date','date'],['建设状态','status','status',1],['责任单位','unit','text'],['管廊负责人','manager','text']].map(([label,key,type,req])=>`<label class="form-field form-item"><span class="form-label ${req?'form-required':''}">${label}</span>${type==='project'?`<select class="form-control"><option value="">请选择</option><option selected>光谷科学岛综合开发项目</option><option>厦门金山财富中心</option></select>`:type==='type'?`<select class="form-control"><option value="">请选择</option><option>综合管廊</option><option>缆线管廊</option><option>燃气管廊</option><option>热力管廊</option></select>`:type==='level'?`<select class="form-control"><option value="">请选择</option><option>A级</option><option>B级</option><option>C级</option></select>`:type==='section'?`<select class="form-control"><option value="">请选择</option><option>矩形断面</option><option>圆形断面</option><option>马蹄形断面</option></select>`:type==='structure'?`<select class="form-control"><option value="">请选择</option><option>现浇钢筋混凝土</option><option>预制拼装</option><option>钢结构</option></select>`:type==='status'?`<select class="form-control"><option>正常运行</option><option ${i.status==='部分运行'?'selected':''}>部分运行</option><option ${i.status==='停运'?'selected':''}>停运</option></select>`:`<input class="form-control" type="${type}" value="${key==='project'&&c?'光谷科学岛综合开发项目':v(key)}" placeholder="请输入">`}</label>`).join('')}</div><label class="form-field form-item"><span class="form-label">备注</span><textarea class="form-control textarea" maxlength="200" placeholder="请输入">${v('note')}</textarea></label>`;}
function openDrawer(mode,i=corridors[0]){window.openAppDrawer({title:mode==='create'?'新增管廊':mode==='edit'?'编辑管廊':'管廊详情',subtitle:`项目管理 · 管廊管理${mode==='create'?'':` · ${i.name}`}`,body:mode==='detail'?detailBody(i):formBody(i,mode),footer:`<button class="btn btn-secondary" type="button" data-drawer-close>${mode==='detail'?'关闭':'取消'}</button>${mode==='detail'?'':`<button class="btn btn-primary" type="button" data-drawer-close>确认</button>`}`});}function updateSelection(){document.querySelector('[data-action="delete-selected"]').disabled=!document.querySelector('[data-building-check]:checked');}renderRows();
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='create')openDrawer('create');if(a==='refresh')renderRows();if(a==='reset'){document.querySelectorAll('[data-filter]').forEach(x=>x.value='');renderRows(corridors);}if(a==='search'){const f=Object.fromEntries([...document.querySelectorAll('[data-filter]')].map(x=>[x.dataset.filter,x.value]));renderRows(corridors.filter(i=>(!f.keyword||(i.code+i.name).includes(f.keyword))&&(!f.type||i.type===f.type)&&(!f.status||i.status===f.status)));}if(a==='export')window.openAppDrawer({title:'导出管廊',subtitle:'项目管理 · 管廊管理',body:'<p>已按当前筛选条件生成管廊列表导出任务。</p>',footer:'<button class="btn btn-primary" type="button" data-drawer-close>知道了</button>'});if(a==='collapse'){const x=document.querySelector('.building-filters').classList.toggle('is-expanded');e.target.closest('button').innerHTML=x?'收起 <i class="fa-solid fa-chevron-up"></i>':'展开 <i class="fa-solid fa-chevron-down"></i>';}if(a==='delete-selected'){const s=[...document.querySelectorAll('[data-building-check]:checked')].map(x=>byId(x.closest('tr').dataset.buildingId));if(s.length)window.openAppConfirm({title:'提示',message:`确认删除选中的【${s.length}】条管廊记录吗？`,onConfirm:()=>{s.forEach(i=>{const n=corridors.indexOf(i);if(n>=0)corridors.splice(n,1);});renderRows();}});}const r=e.target.closest('[data-building-action]');if(r){const i=byId(r.dataset.buildingId);if(r.dataset.buildingAction==='cabin-management'){location.href=`floor.html?project=${encodeURIComponent(i.project)}&building=${encodeURIComponent(i.name)}`;return;}if(r.dataset.buildingAction==='delete')window.openAppConfirm({title:'提示',message:'当前项目下关联了管廊/舱室/区段/管线/设备，将无法删除，请解除关联后删除。',onConfirm:()=>{corridors.splice(corridors.indexOf(i),1);renderRows();}});else openDrawer(r.dataset.buildingAction,i);}if(e.target.matches('[data-building-check]'))updateSelection();});document.addEventListener('change',e=>{if(e.target.matches('[data-select-all]')){document.querySelectorAll('[data-building-check]').forEach(x=>x.checked=e.target.checked);updateSelection();}});
</script><script>const projectParam=new URLSearchParams(location.search).get('project');if(projectParam){const matched=corridors.filter((item)=>item.project===projectParam||item.project.includes(projectParam)||projectParam.includes(item.project));renderRows(matched);}</script></body></html>
