<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报警信息 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/alarm-center.css">
  <style>
    .alarm-detail-grid .info-item { border-bottom: 0; }
  </style>
</head>
<body class="alarm-page alarm-info-page" data-menu-key="alarm-center.info" data-page-section="报警中心" data-page-title="报警信息">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main">
      <div class="screen-frame stack">
        <section class="card alarm-filter-card">
          <div class="filter-actions alarm-info-filter-row">
            <label class="form-field"><span class="form-label">报警类型</span><select class="form-control" data-filter="type"><option value="">请选择</option><option>设备属性</option><option>设备离线</option></select></label>
            <label class="form-field"><span class="form-label">报警等级</span><select class="form-control" data-filter="level"><option value="">请选择</option><option>告警</option><option>预警</option><option>提醒</option></select></label>
            <label class="form-field"><span class="form-label">报警状态</span><select class="form-control" data-filter="status"><option value="">请选择</option><option>未处理</option><option>处理中</option><option>已处理</option></select></label>
            <label class="form-field"><span class="form-label">报警时间</span><input class="form-control" data-filter="date" placeholder="开始日期  —  结束日期"></label>
            <label class="form-field"><span class="form-label">转单状态</span><select class="form-control" data-filter="transferStatus"><option value="">请选择</option><option>未转单</option><option>已转单</option></select></label>
            <button class="btn btn-secondary" type="button" data-action="reset">重置</button>
            <button class="btn btn-primary" type="button" data-action="search">搜索</button>
          </div>
        </section>
        <section class="card alarm-list-card">
          <div class="card-title-row alarm-toolbar"><h1 class="card-title">报警信息列表</h1><div class="btn-row"><button class="btn btn-secondary" type="button" data-action="export"><i class="fa-solid fa-download"></i>导出</button><div class="alarm-batch-menu"><button class="btn btn-primary" type="button">批量处理<i class="fa-solid fa-chevron-down alarm-batch-chevron"></i></button><div class="alarm-batch-panel" data-batch-panel><span class="alarm-batch-count">已选择 <strong data-batch-count>0</strong> 条未处理报警</span><div class="alarm-batch-actions"><button class="btn btn-secondary" type="button" data-batch-action="false">误报</button><button class="btn btn-secondary" type="button" data-batch-action="process">处理</button><button class="btn btn-primary" type="button" data-batch-action="transfer">转工单</button></div></div></div></div></div>
          <div class="table-wrap"><table class="table alarm-table alarm-info-table"><thead><tr><th class="alarm-select-col">选择</th><th>序号</th><th>报警设备</th><th>设备编码</th><th>报警类型</th><th>报警描述</th><th>报警等级</th><th>报警时间</th><th>报警状态</th><th>转单状态</th><th>工单编号</th><th>操作</th></tr></thead><tbody id="alarmInfoBody"></tbody></table></div>
          <div class="pagination"><span>共 <strong id="alarmInfoCount">0</strong> 条，每页 10 条</span><span class="page-item active">1</span></div>
        </section>
      </div>
    </main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-home-1"></script>
  <script src="../../../app/components/sidebar.js?v=nav-home-1"></script>
  <script src="../../../app/components/header.js?v=nav-home-1"></script>
  <script src="../../../app/components/drawer.js"></script>
  <script src="../../../app/components/requirement.js"></script>
  <script src="../../../app/data/emergency-data.js"></script>
  <script>
    const alarmInfo = [
      { id: 1, device: "配电室网关-01", type: "设备离线", message: "设备离线持续超过 60 秒", level: "告警", time: "2026-09-07 09:42:16", status: "未处理", history: [{ time: "2026-09-07 09:42:16", operator: "系统", action: "创建报警" }] },
      { id: 2, device: "冷水机组-01", type: "设备属性", message: "冷冻水供水温度高于 12℃", level: "预警", time: "2026-09-07 09:18:42", status: "处理中", process: { workOrderNo: "WO20260907002", workOrderName: "冷水机组高温检查", description: "检查冷冻水供水温度异常原因", type: "设备属性", image: "现场图片（Mock）", remark: "已通知维保人员到场排查。" }, history: [{ time: "2026-09-07 09:18:42", operator: "系统", action: "创建报警" }, { time: "2026-09-07 09:30:12", operator: "张三", action: "开始处理，已通知维保人员" }] },
      { id: 3, device: "地下车库水泵-02", type: "设备属性", message: "水泵运行电流异常", level: "提醒", time: "2026-09-07 08:56:30", status: "已处理", closeReason: "告警已解决", closeRemark: "复位水泵后运行正常。", closedAt: "2026-09-07 09:20:18", closedBy: "李四", process: { workOrderNo: "WO20260907003", workOrderName: "地下车库水泵巡检", description: "处理水泵运行电流异常", type: "设备属性", image: "现场图片（Mock）", remark: "完成复位并确认设备运行正常。" }, history: [{ time: "2026-09-07 08:56:30", operator: "系统", action: "创建报警" }, { time: "2026-09-07 09:15:40", operator: "李四", action: "完成水泵复位，设备恢复正常" }, { time: "2026-09-07 09:20:18", operator: "李四", action: "告警已解决，完成处理" }] },
      { id: 4, device: "消防水箱液位计", type: "设备属性", message: "消防水箱液位低于下限", level: "告警", time: "2026-09-06 22:11:08", status: "未处理", history: [{ time: "2026-09-06 22:11:08", operator: "系统", action: "创建报警" }] },
      { id: 5, device: "楼宇自控网关-03", type: "设备离线", message: "设备通信中断，请及时检查", level: "预警", time: "2026-09-06 18:35:27", status: "已处理", closeReason: "误报无问题", closeRemark: "现场确认设备正常。", closedAt: "2026-09-06 18:50:06", closedBy: "王五", history: [{ time: "2026-09-06 18:35:27", operator: "系统", action: "创建报警" }, { time: "2026-09-06 18:50:06", operator: "王五", action: "误报无问题，完成处理" }] },
      { id: 6, device: "地下车库排风机-01", type: "设备属性", message: "排风机运行频率低于设定值", level: "预警", time: "2026-09-08 10:16:24", status: "未处理", history: [{ time: "2026-09-08 10:16:24", operator: "系统", action: "创建报警" }] },
      { id: 7, device: "屋顶消防泵-02", type: "设备离线", message: "设备通信中断，请及时检查", level: "告警", time: "2026-09-08 09:48:11", status: "未处理", history: [{ time: "2026-09-08 09:48:11", operator: "系统", action: "创建报警" }] },
      { id: 8, device: "办公区照明控制器-05", type: "设备属性", message: "照明回路状态异常", level: "提醒", time: "2026-09-08 09:22:37", status: "未处理", history: [{ time: "2026-09-08 09:22:37", operator: "系统", action: "创建报警" }] }
    ];
    const alarmInfoBody = document.getElementById("alarmInfoBody");
    function levelClass(level) { return level === "告警" ? "high" : level === "预警" ? "medium" : "low"; }
    function statusClass(status) { return status === "未处理" ? "active" : status === "处理中" ? "processing" : "processed"; }
    function deviceCode(item) { return item.deviceCode || `DEV-${String(item.id).padStart(4, "0")}`; }
    function transferStatus(item) { return item.transferStatus || (item.process ? "已转单" : "未转单"); }
    function workOrderNo(item) { return item.workOrderNo || item.transfer?.workOrderNo || item.process?.workOrderNo || "-"; }
    function transferTime(item) { return item.transferTime || item.transfer?.transferTime || (item.process ? item.time : "-"); }
    function actionMarkup(item) { return item.status === "未处理" ? `<button class="table-action" type="button" data-alarm-action="detail" data-alarm-id="${item.id}">详情</button><button class="table-action" type="button" data-alarm-action="emergency" data-alarm-id="${item.id}">转应急事件</button><button class="table-action" type="button" data-alarm-action="false" data-alarm-id="${item.id}">误报</button><button class="table-action" type="button" data-alarm-action="process" data-alarm-id="${item.id}">处理</button><button class="table-action" type="button" data-alarm-action="transfer" data-alarm-id="${item.id}">转工单</button>` : `<button class="table-action" type="button" data-alarm-action="detail" data-alarm-id="${item.id}">${item.emergencyEventId ? "查看应急事件" : "详情"}</button>`; }
    function renderAlarmInfo(list = alarmInfo) {
      alarmInfoBody.innerHTML = list.map((item, index) => `<tr data-alarm-id="${item.id}"><td class="alarm-select-col"><input class="alarm-row-check" type="checkbox" data-alarm-select="${item.id}" ${item.status === "未处理" ? "" : "disabled"} aria-label="选择${item.device}"></td><td>${index + 1}</td><td>${item.device}</td><td>${deviceCode(item)}</td><td>${item.type}</td><td class="alarm-message" title="${item.message}">${item.message}</td><td><span class="alarm-level ${levelClass(item.level)}">${item.level}</span></td><td>${item.time}</td><td><span class="alarm-state ${statusClass(item.status)}">${item.status}</span></td><td><span class="alarm-transfer-state ${transferStatus(item) === "已转单" ? "is-transferred" : "is-pending"}">${transferStatus(item)}</span></td><td>${workOrderNo(item)}</td><td>${actionMarkup(item)}</td></tr>`).join("");
      document.getElementById("alarmInfoCount").textContent = list.length;
      syncBatchActions();
    }
    function alarmInfoById(id) { return alarmInfo.find((item) => String(item.id) === String(id)) || alarmInfo[0]; }
    function convertAlarmToEmergency(item) {
      const emergencyStore = window.EMERGENCY_STORE;
      if (!emergencyStore || typeof emergencyStore.saveEvent !== "function") { window.alert("应急事件模块尚未加载"); return; }
      const sourceAlarmId = String(item.id);
      const existing = typeof emergencyStore.listEvents === "function" ? emergencyStore.listEvents().find((event) => String(event.sourceAlarmId) === sourceAlarmId) : null;
      if (existing) { item.emergencyEventId = existing.eventId; window.location.href = `../emergency/events.html?eventId=${encodeURIComponent(existing.eventId)}`; return; }
      const levelMap = { "告警": "P1", "预警": "P2", "提醒": "P3" };
      const now = new Date().toISOString().slice(0, 19).replace("T", " ");
      const event = window.EMERGENCY_STORE.saveEvent({ eventId: `EVT-ALARM-${sourceAlarmId}-${Date.now()}`, sourceAlarmId, title: `${item.device} ${item.type}`, eventType: item.type === "设备离线" ? "设备离线" : "设备异常", level: levelMap[item.level] || "P2", source: "报警中心", location: item.location || item.property || "待定位", occurrenceTime: item.time, discoveredAt: now, description: item.message, status: "待确认", timeline: [{ time: now, operator: "报警中心", action: `由报警 ${deviceCode(item)} 转入应急事件` }] });
      item.emergencyEventId = event.eventId;
      item.history = [...(item.history || []), { time: now, operator: "当前用户", action: `已转应急事件 ${event.eventId}` }];
      window.location.href = `../emergency/events.html?eventId=${encodeURIComponent(event.eventId)}`;
    }
    function historyMarkup(item) { return item.history?.length ? `<section class="detail-section"><h3 class="detail-title">处理记录</h3><div class="alarm-history">${item.history.map((entry) => `<div class="alarm-history-item"><span class="alarm-history-time">${entry.time}</span><strong>${entry.operator}</strong><span>${entry.action}</span></div>`).join("")}</div></section>` : ""; }
    function transferMarkup(item) { const transfer = item.transfer; return transfer ? `<section class="detail-section"><h3 class="detail-title">转工单信息</h3><div class="detail-grid alarm-detail-grid"><div class="info-item"><span class="info-label">联系人</span><span class="info-value">${transfer.contact || "-"}</span></div><div class="info-item"><span class="info-label">联系电话</span><span class="info-value">${transfer.phone || "-"}</span></div><div class="info-item"><span class="info-label">工单类型</span><span class="info-value">${transfer.workOrderType || "-"}</span></div><div class="info-item"><span class="info-label">工单分类</span><span class="info-value">${transfer.workOrderCategory || "-"}</span></div><div class="info-item"><span class="info-label">报修内容</span><span class="info-value">${transfer.reportContent || "-"}</span></div><div class="info-item"><span class="info-label">上传照片</span><span class="info-value">${transfer.photo || "未上传"}</span></div></div></section>` : ""; }
    function closeMarkup(item) {
      const handler = item.processedBy || item.closedBy || "-";
      const handledAt = item.processedAt || item.closedAt || "-";
      const remark = item.processRemark || item.closeRemark || "-";
      return item.closeReason || item.closeRemark || item.processedBy || item.processedAt
        ? `<section class="detail-section"><h3 class="detail-title">报警解除信息</h3><div class="detail-grid alarm-detail-grid"><div class="info-item"><span class="info-label">处理人</span><span class="info-value">${handler}</span></div><div class="info-item"><span class="info-label">处理时间</span><span class="info-value">${handledAt}</span></div><div class="info-item"><span class="info-label">备注</span><span class="info-value">${remark}</span></div></div></section>`
        : "";
    }
    function alarmDetailInfoMarkup(item) { return `<section class="detail-section"><h3 class="detail-title">报警信息</h3><div class="detail-grid alarm-detail-grid"><div class="info-item"><span class="info-label">报警设备</span><span class="info-value">${item.device}</span></div><div class="info-item"><span class="info-label">设备编码</span><span class="info-value">${deviceCode(item)}</span></div><div class="info-item"><span class="info-label">所属系统</span><span class="info-value">${item.system || (item.type === "设备离线" ? "弱电系统" : "机电系统")}</span></div><div class="info-item"><span class="info-label">设备分类</span><span class="info-value">${item.category || (item.type === "设备离线" ? "网关" : "水泵")}</span></div><div class="info-item"><span class="info-label">所属房源</span><span class="info-value">${item.property || "1号楼 / 1层 / 设备间"}</span></div><div class="info-item"><span class="info-label">安装位置</span><span class="info-value">${item.location || "设备间"}</span></div><div class="info-item"><span class="info-label">报警类型</span><span class="info-value">${item.type}</span></div><div class="info-item"><span class="info-label">报警等级</span><span class="info-value"><span class="alarm-level ${levelClass(item.level)}">${item.level}</span></span></div><div class="info-item"><span class="info-label">报警状态</span><span class="info-value"><span class="alarm-state ${statusClass(item.status)}">${item.status}</span></span></div><div class="info-item"><span class="info-label">报警时间</span><span class="info-value">${item.time}</span></div><div class="info-item"><span class="info-label">转单状态</span><span class="info-value"><span class="alarm-transfer-state ${transferStatus(item) === "已转单" ? "is-transferred" : "is-pending"}">${transferStatus(item)}</span></span></div><div class="info-item"><span class="info-label">工单编号</span><span class="info-value">${workOrderNo(item)}</span></div><div class="info-item"><span class="info-label">转工单时间</span><span class="info-value">${transferTime(item)}</span></div><div class="info-item"><span class="info-label">关联规则</span><span class="info-value">${item.type === "设备离线" ? "设备离线监测规则" : "设备属性异常规则"}</span></div><div class="info-item"><span class="info-label">报警描述</span><span class="info-value">${item.message}</span></div></div></section>`; }
    function detailRecordsMarkup(item) { const content = `${transferMarkup(item)}${closeMarkup(item)}${historyMarkup(item)}`; return content || '<div class="alarm-detail-empty">暂无处理记录</div>'; }
    function openAlarmInfoDetail(item) {
      window.openAppDrawer({
        title: "报警详情",
        subtitle: "报警中心 · 报警信息",
        body: `<div class="alarm-detail-tabs" role="tablist"><button class="alarm-detail-tab active" type="button" role="tab" aria-selected="true" data-detail-tab="info">报警信息</button><button class="alarm-detail-tab" type="button" role="tab" aria-selected="false" data-detail-tab="records">处理记录</button></div><div data-detail-pane="info">${alarmDetailInfoMarkup(item)}</div><div class="hidden" data-detail-pane="records">${detailRecordsMarkup(item)}</div>`,
        footer: item.status === "未处理" ? `<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button><button class="btn btn-primary" type="button" data-detail-transfer="${item.id}">转工单</button>` : `<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>`
      });
    }
    function openTransferPanel(item, ids = [item.id]) { const transfer = item.transfer || {}; window.openAppDrawer({ title: ids.length > 1 ? "批量转工单" : "告警转工单", subtitle: "报警中心 · 报警信息", body: `<div class="form-grid-2 alarm-transfer-form"><label class="form-field form-item"><span class="form-label form-required">联系人</span><input class="form-control" data-transfer-field="contact" value="${transfer.contact || ""}" placeholder="请输入联系人"></label><label class="form-field form-item"><span class="form-label form-required">联系电话</span><input class="form-control" data-transfer-field="phone" value="${transfer.phone || ""}" placeholder="请输入联系电话"></label><label class="form-field form-item"><span class="form-label form-required">工单类型</span><select class="form-control" data-transfer-field="workOrderType"><option value="">请选择工单类型</option><option ${transfer.workOrderType === "室内报修" ? "selected" : ""}>室内报修</option><option ${transfer.workOrderType === "公区报修" ? "selected" : ""}>公区报修</option></select></label><label class="form-field form-item"><span class="form-label form-required">工单分类</span><select class="form-control" data-transfer-field="workOrderCategory"><option value="">请选择工单分类</option><option ${transfer.workOrderCategory === "设备故障" ? "selected" : ""}>设备故障</option><option ${transfer.workOrderCategory === "设备维护" ? "selected" : ""}>设备维护</option><option ${transfer.workOrderCategory === "其他" ? "selected" : ""}>其他</option></select></label><label class="form-field form-item"><span class="form-label form-required">紧急程度</span><select class="form-control" data-transfer-field="urgency"><option value="">请选择紧急程度</option><option ${transfer.urgency === "一般" ? "selected" : ""}>一般</option><option ${transfer.urgency === "紧急" ? "selected" : ""}>紧急</option></select></label><label class="form-field form-item form-span-2"><span class="form-label form-required">报修内容</span><textarea class="form-control textarea alarm-transfer-textarea" data-transfer-field="reportContent" placeholder="请输入报修内容">${transfer.reportContent || item.message}</textarea></label><div class="form-field form-item form-span-2"><span class="form-label">上传照片</span><button class="alarm-upload-box" type="button" data-transfer-upload><span class="alarm-upload-plus">+</span><span>上传</span></button><span class="alarm-upload-help">支持 jpg、jpeg、png、gif、webp 格式，单个文件不超过 5MB</span></div></div>`, footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-transfer-save="${ids.join(",")}">确认</button>` }); }
    function openFalseAlarmPanel(ids) { window.openAppDrawer({ title: "误报确认", subtitle: "报警中心 · 报警信息", body: `<label class="form-field form-item"><span class="form-label form-required">误报说明</span><textarea class="form-control textarea" data-false-remark placeholder="请输入误报说明"></textarea></label>`, footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-false-save="${ids.join(",")}">确认</button>` }); }
    function openProcessPanel(ids) { window.openAppDrawer({ title: "处理确认", subtitle: "报警中心 · 报警信息", body: `<div class="form-grid-2 alarm-process-form"><label class="form-field form-item"><span class="form-label form-required">处理人</span><select class="form-control" data-process-field="handler"><option value="">请选择处理人</option><option>管理员</option><option>张三</option><option>李四</option></select></label><label class="form-field form-item"><span class="form-label form-required">处理时间</span><input class="form-control" type="datetime-local" data-process-field="handledAt"></label><label class="form-field form-item form-span-2"><span class="form-label form-required">备注</span><textarea class="form-control textarea" data-process-field="remark" placeholder="请输入处理备注"></textarea></label></div>`, footer: `<button class="btn btn-secondary" type="button" data-drawer-close>取消</button><button class="btn btn-primary" type="button" data-process-save="${ids.join(",")}">确认</button>` }); }
    function filterAlarmInfo() {
      const filters = Object.fromEntries([...document.querySelectorAll("[data-filter]")].map((input) => [input.dataset.filter, input.value]));
      renderAlarmInfo(alarmInfo.filter((item) => (!filters.type || item.type === filters.type) && (!filters.level || item.level === filters.level) && (!filters.status || item.status === filters.status) && (!filters.transferStatus || transferStatus(item) === filters.transferStatus) && (!filters.date || item.time.includes(filters.date))));
    }
    function selectedAlarmIds() { return [...document.querySelectorAll("[data-alarm-select]:checked")].map((input) => input.dataset.alarmSelect); }
    function syncBatchActions() {
      const ids = selectedAlarmIds();
      const count = document.querySelector("[data-batch-count]");
      if (count) count.textContent = ids.length;
      document.querySelectorAll("[data-batch-action]").forEach((button) => { button.disabled = !ids.length; });
    }
    function saveAlarmProcessing(ids, values) {
      ids.forEach((id) => {
        const item = alarmInfoById(id);
        item.status = "已处理";
        item.processedBy = values.handler;
        item.processedAt = values.handledAt;
        item.processRemark = values.remark;
        item.history = [...(item.history || []), { time: values.handledAt, operator: values.handler, action: values.remark }];
      });
      window.closeAppDrawer();
      renderAlarmInfo();
    }
    document.addEventListener("click", (event) => {
      const action = event.target.closest("[data-action]")?.dataset.action;
      if (action === "search") filterAlarmInfo();
      if (action === "reset") { document.querySelectorAll("[data-filter]").forEach((input) => { input.value = ""; }); renderAlarmInfo(); }
      if (action === "export") window.openAppDrawer({ title: "导出报警信息", subtitle: "报警中心 · 报警信息", body: "<p>已按当前筛选条件生成报警信息文件（Mock）。</p>", footer: "<button class=\"btn btn-secondary\" data-drawer-close>取消</button><button class=\"btn btn-primary\" data-drawer-close>确认导出</button>" });
      const detail = event.target.closest('[data-alarm-action="detail"]');
      if (detail) { openAlarmInfoDetail(alarmInfoById(detail.dataset.alarmId)); }
      const alarmAction = event.target.closest("[data-alarm-action]");
      if (alarmAction?.dataset.alarmAction === "emergency") convertAlarmToEmergency(alarmInfoById(alarmAction.dataset.alarmId));
      if (alarmAction?.dataset.alarmAction === "false") openFalseAlarmPanel([alarmAction.dataset.alarmId]);
      if (alarmAction?.dataset.alarmAction === "process") openProcessPanel([alarmAction.dataset.alarmId]);
      if (alarmAction?.dataset.alarmAction === "transfer") openTransferPanel(alarmInfoById(alarmAction.dataset.alarmId));
      const batchAction = event.target.closest("[data-batch-action]");
      if (batchAction) {
        const ids = selectedAlarmIds();
        if (ids.length && batchAction.dataset.batchAction === "false") openFalseAlarmPanel(ids);
        if (ids.length && batchAction.dataset.batchAction === "process") openProcessPanel(ids);
        if (ids.length && batchAction.dataset.batchAction === "transfer") openTransferPanel(alarmInfoById(ids[0]), ids);
      }
      const detailTab = event.target.closest("[data-detail-tab]"); if (detailTab) { const body = document.getElementById("drawerBody"); const tabKey = detailTab.dataset.detailTab; body?.querySelectorAll("[data-detail-tab]").forEach((tab) => { const active = tab === detailTab; tab.classList.toggle("active", active); tab.setAttribute("aria-selected", String(active)); }); body?.querySelectorAll("[data-detail-pane]").forEach((pane) => pane.classList.toggle("hidden", pane.dataset.detailPane !== tabKey)); }
      const detailTransfer = event.target.closest("[data-detail-transfer]"); if (detailTransfer) openTransferPanel(alarmInfoById(detailTransfer.dataset.detailTransfer));
      const upload = event.target.closest("[data-transfer-upload]"); if (upload) { upload.classList.add("is-uploaded"); upload.innerHTML = '<span class="alarm-upload-plus">✓</span><span>现场照片（Mock）</span>'; }
      const transferSave = event.target.closest("[data-transfer-save]"); if (transferSave) { const fields = Object.fromEntries([...document.querySelectorAll("[data-transfer-field]")].map((field) => [field.dataset.transferField, field.value.trim()])); const required = [["contact", "请输入联系人"], ["phone", "请输入联系电话"], ["workOrderType", "请选择工单类型"], ["workOrderCategory", "请选择工单分类"], ["urgency", "请选择紧急程度"], ["reportContent", "请输入报修内容"]]; document.querySelectorAll(".alarm-transfer-form .form-error").forEach((error) => error.remove()); document.querySelectorAll(".alarm-transfer-form .error").forEach((field) => field.classList.remove("error")); let valid = true; required.forEach(([key, message]) => { const field = document.querySelector(`[data-transfer-field="${key}"]`); if (!fields[key]) { field?.classList.add("error"); const error = document.createElement("span"); error.className = "form-error"; error.textContent = message; field?.closest(".form-field")?.appendChild(error); valid = false; } }); if (!valid) return; const ids = transferSave.dataset.transferSave.split(","); const transferTime = "2026-09-08 10:30:00"; ids.forEach((id) => { const item = alarmInfoById(id); const workOrderNo = item.workOrderNo || `WO2026090800${item.id}`; item.status = "处理中"; item.transferStatus = "已转单"; item.workOrderNo = workOrderNo; item.transferTime = transferTime; item.transfer = { ...fields, workOrderNo, transferTime, photo: document.querySelector("[data-transfer-upload]")?.classList.contains("is-uploaded") ? "现场照片（Mock）" : "" }; item.history = [...(item.history || []), { time: transferTime, operator: "当前用户", action: `已转工单，工单编号 ${workOrderNo}` }]; }); window.closeAppDrawer(); renderAlarmInfo(); }
      const falseSave = event.target.closest("[data-false-save]"); if (falseSave) { const remark = document.querySelector("[data-false-remark]")?.value.trim(); if (!remark) { document.querySelector("[data-false-remark]")?.classList.add("error"); return; } const processedAt = "2026-09-08 10:40:00"; falseSave.dataset.falseSave.split(",").forEach((id) => { const item = alarmInfoById(id); item.status = "已处理"; item.processedBy = "当前用户"; item.processedAt = processedAt; item.processRemark = remark; item.closeReason = "误报无问题"; item.closeRemark = remark; item.history = [...(item.history || []), { time: processedAt, operator: "当前用户", action: `确认误报：${remark}` }]; }); window.closeAppDrawer(); renderAlarmInfo(); }
      const processSave = event.target.closest("[data-process-save]"); if (processSave) { const values = Object.fromEntries([...document.querySelectorAll("[data-process-field]")].map((field) => [field.dataset.processField, field.value.trim()])); const required = [["handler", "请选择处理人"], ["handledAt", "请选择处理时间"], ["remark", "请输入备注"]]; document.querySelectorAll(".alarm-process-form .form-error").forEach((error) => error.remove()); document.querySelectorAll(".alarm-process-form .error").forEach((field) => field.classList.remove("error")); let valid = true; required.forEach(([key, message]) => { const field = document.querySelector(`[data-process-field="${key}"]`); if (!values[key]) { field?.classList.add("error"); const error = document.createElement("span"); error.className = "form-error"; error.textContent = message; field?.closest(".form-field")?.appendChild(error); valid = false; } }); if (valid) saveAlarmProcessing(processSave.dataset.processSave.split(","), values); }
    });
    document.addEventListener("change", (event) => { if (event.target.matches("[data-alarm-select]")) syncBatchActions(); });
    renderAlarmInfo();
  </script>
