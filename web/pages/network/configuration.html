<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组态系统 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <style>
    :root{--ink:#192435;--muted:#758297;--line:#e6ebf2;--blue:#135afa;--cyan:#39d7ff;--green:#2dd39a;--amber:#f3b84b;--red:#ff5d70;--offline:#8995a6}
    .configuration-page .main{background:#f5f7fc}.configuration-workspace{padding:24px;max-width:1680px;margin:auto}.config-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.config-head h1{margin:0;color:var(--ink);font-size:24px}.config-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.config-actions{display:flex;gap:8px;align-items:center}.config-time{color:var(--muted);font-size:12px;margin-right:10px}.config-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line)}.config-tab{border:0;background:transparent;padding:12px 22px;color:var(--muted);font-weight:700;cursor:pointer;border-bottom:2px solid transparent}.config-tab.active{color:var(--blue);border-color:var(--blue)}.config-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.config-kpi{background:#fff;border:1px solid var(--line);border-radius:4px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}.config-kpi span{display:block;color:var(--muted);font-size:12px}.config-kpi strong{display:block;margin-top:7px;color:var(--ink);font-size:24px}.config-kpi em{font-style:normal;color:var(--green);font-size:12px}.config-kpi i{font-size:20px;color:var(--blue);opacity:.8}.config-grid{display:grid;grid-template-columns:220px minmax(520px,1fr) 300px;gap:14px;align-items:stretch}.config-panel{background:#fff;border:1px solid var(--line);border-radius:4px;min-width:0}.config-panel-head{height:54px;padding:0 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.config-panel-head h2{font-size:14px;margin:0;color:var(--ink)}.config-panel-head span{font-size:12px;color:var(--muted)}.config-panel-body{padding:16px}.filter-label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.config-filter{margin-bottom:18px}.config-filter select{width:100%;height:34px;border:1px solid var(--line);border-radius:3px;padding:0 9px;color:var(--ink);background:#fff}.chip-list{display:flex;flex-wrap:wrap;gap:7px}.config-chip{border:1px solid var(--line);border-radius:3px;background:#fff;padding:6px 9px;color:#647186;font-size:12px;cursor:pointer}.config-chip.active{border-color:var(--blue);background:#eef3ff;color:var(--blue)}.legend-list{display:grid;gap:10px}.legend-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#526076}.legend-dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(45,211,154,.14)}.legend-dot.warn{background:var(--amber);box-shadow:0 0 0 3px rgba(243,184,75,.14)}.legend-dot.fault{background:var(--red);box-shadow:0 0 0 3px rgba(255,93,112,.14)}.legend-dot.offline{background:var(--offline);box-shadow:0 0 0 3px rgba(137,149,166,.14)}.topology-card{overflow:hidden}.topology-toolbar{height:54px;padding:0 14px;background:#121b2a;color:#d6e6ff;display:flex;align-items:center;justify-content:space-between}.topology-toolbar strong{font-size:13px}.topology-toolbar small{color:#8fa3bd}.topology-actions{display:flex;gap:6px}.topology-actions button{width:30px;height:28px;border:1px solid #32445f;background:#1a2a40;color:#bad0eb;border-radius:3px;cursor:pointer}.topology-stage{height:560px;position:relative;background:#0c1421;overflow:hidden}.topology-stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(117,153,193,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(117,153,193,.08) 1px,transparent 1px);background-size:32px 32px}.topology-stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.link-line{stroke:#3f668c;stroke-width:2;stroke-dasharray:6 5;opacity:.9}.link-line.good{stroke:#2dd39a}.link-line.warn{stroke:#f3b84b}.link-line.fault{stroke:#ff5d70}.node{cursor:pointer}.node circle{fill:#13243a;stroke:#4d7ea8;stroke-width:2}.node.online circle{stroke:var(--green)}.node.warn circle{stroke:var(--amber)}.node.fault circle{stroke:var(--red)}.node.offline circle{stroke:var(--offline)}.node.selected circle{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px #fff)}.node text{fill:#dcecff;font-size:12px;text-anchor:middle;pointer-events:none}.node .node-id{fill:#8198b2;font-size:10px}.node .alarm-ring{fill:none;stroke:var(--red);stroke-width:2;opacity:.8;animation:pulse 1.6s infinite}.node .node-core{fill:var(--cyan);stroke:none}.node.warn .node-core{fill:var(--amber)}.node.fault .node-core{fill:var(--red)}.node.offline .node-core{fill:var(--offline)}@keyframes pulse{0%,100%{r:28;opacity:.8}50%{r:36;opacity:0}}.detail-hero{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line)}.detail-icon{width:36px;height:36px;display:grid;place-items:center;border-radius:4px;background:#edf3ff;color:var(--blue);font-size:18px}.detail-hero strong{display:block;color:var(--ink);font-size:13px}.detail-hero small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.status-pill{margin-left:auto;padding:4px 7px;border-radius:3px;font-size:11px;font-weight:700}.status-pill.online{background:#e8fbf4;color:#148c68}.status-pill.warn{background:#fff6e1;color:#a06a00}.status-pill.fault{background:#fff0f2;color:#cb3f52}.status-pill.offline{background:#eef1f5;color:#687588}.detail-list{display:grid;gap:12px;padding:16px 0}.detail-row{display:flex;justify-content:space-between;gap:10px;font-size:12px}.detail-row span:first-child{color:var(--muted)}.detail-row span:last-child{color:var(--ink);font-weight:600;text-align:right}.alarm-list{display:grid;gap:8px;padding:12px}.alarm-item{width:100%;text-align:left;border:1px solid #f4d8dd;background:#fff8f9;border-radius:3px;padding:9px;cursor:pointer}.alarm-item strong{display:block;color:#b3374a;font-size:12px}.alarm-item small{display:block;color:#88727a;margin-top:4px;font-size:11px}.status-table{margin-top:14px}.status-table .table-wrap{overflow:auto}.status-table table{width:100%;border-collapse:collapse;font-size:12px}.status-table th,.status-table td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.status-table th{color:#69778b;background:#f8faff;font-weight:600}.status-table td{color:#455268}.state-text{font-weight:700}.state-text.online{color:#15946e}.state-text.warn{color:#b77b08}.state-text.fault{color:#d24a5c}.state-text.offline{color:#748094}.empty-state{padding:40px;text-align:center;color:#8a96a8;font-size:13px}.config-grid.is-device .topology-stage{height:620px}@media(max-width:1200px){.config-grid{grid-template-columns:190px minmax(420px,1fr)}.config-grid>.config-panel:last-child{grid-column:1/-1}.config-summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.configuration-workspace{padding:14px}.config-head{display:block}.config-actions{margin-top:12px}.config-summary{grid-template-columns:1fr 1fr}.config-grid{display:block}.config-panel{margin-bottom:12px}.topology-stage,.config-grid.is-device .topology-stage{height:480px}.config-tabs{overflow:auto}.config-tab{white-space:nowrap}}
    @media(max-width:1400px) and (min-width:761px){.config-grid{grid-template-columns:190px minmax(0,1fr)}.config-grid>.config-panel:last-child{grid-column:1/-1}}
  </style>
</head>
<body class="configuration-page" data-menu-key="configuration" data-page-section="组态系统" data-page-title="组态系统">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header><main class="main"><div class="configuration-workspace">
    <nav class="config-tabs" role="tablist"><button class="config-tab active" data-tab="gateway" role="tab">网关拓扑</button><button class="config-tab" data-tab="device" role="tab">设备拓扑</button></nav>
    <section class="config-summary"><article class="config-kpi"><div><span id="kpiLabel1">网关总数</span><strong id="kpiTotal">8</strong><em id="kpiNote1">在线 7 · 离线 1</em></div><i class="fa-solid fa-server"></i></article><article class="config-kpi"><div><span>在线率</span><strong id="kpiOnline">87.5%</strong><em>实时心跳</em></div><i class="fa-solid fa-signal"></i></article><article class="config-kpi"><div><span id="kpiLabel3">通信链路</span><strong id="kpiLinks">12</strong><em id="kpiNote3">10 条稳定</em></div><i class="fa-solid fa-code-branch"></i></article><article class="config-kpi"><div><span>当前告警</span><strong id="kpiAlarms">3</strong><em style="color:var(--red)">需关注</em></div><i style="color:var(--red)" class="fa-solid fa-triangle-exclamation"></i></article></section>
    <section class="config-grid" id="configGrid"><aside class="config-panel"><div class="config-panel-head"><h2>拓扑筛选</h2><span id="filterCount">全部</span></div><div class="config-panel-body"><div class="config-filter"><label class="filter-label">区域 / 防火分区</label><select id="zoneFilter"><option value="all">全部区域</option><option value="F0103">F0103 电力舱</option><option value="F0104">F0104 燃气舱</option><option value="F0112">F0112 水信舱</option><option value="F0116">F0116 综合舱</option></select></div><div class="config-filter"><label class="filter-label">节点类型</label><div class="chip-list" id="typeChips"><button class="config-chip active" data-type="all">全部</button><button class="config-chip" data-type="core">核心节点</button><button class="config-chip" data-type="gateway">网关</button><button class="config-chip" data-type="device">设备</button></div></div><div class="config-filter"><label class="filter-label">运行状态</label><div class="chip-list" id="statusChips"><button class="config-chip active" data-status="all">全部</button><button class="config-chip" data-status="online">在线</button><button class="config-chip" data-status="warn">预警</button><button class="config-chip" data-status="fault">故障</button><button class="config-chip" data-status="offline">离线</button></div></div><div class="config-filter"><label class="filter-label">状态图例</label><div class="legend-list"><span class="legend-item"><i class="legend-dot"></i>在线 / 正常</span><span class="legend-item"><i class="legend-dot warn"></i>预警</span><span class="legend-item"><i class="legend-dot fault"></i>故障</span><span class="legend-item"><i class="legend-dot offline"></i>离线</span></div></div></div></aside>
      <section class="config-panel topology-card"><div class="topology-toolbar"><div><strong id="topologyTitle">网关通信拓扑</strong><small id="topologyHint">中心平台 · 区域网关 · 边缘网关</small></div><div class="topology-actions"><button title="放大" id="zoomIn"><i class="fa-solid fa-plus"></i></button><button title="缩小" id="zoomOut"><i class="fa-solid fa-minus"></i></button></div></div><div class="topology-stage" id="topologyStage"><svg id="topologyCanvas" viewBox="0 0 900 560" role="img" aria-label="组态拓扑图"></svg></div></section>
      <aside class="config-panel"><div class="config-panel-head"><h2>节点详情</h2><span id="detailHint">点击节点查看</span></div><div class="config-panel-body" id="detailPanel"></div><div class="config-panel-head"><h2>实时告警</h2><span id="alarmCount">3 条</span></div><div class="alarm-list" id="alarmList"></div></aside>
    </section>
    <section class="config-panel status-table"><div class="config-panel-head"><h2 id="tableTitle">网关运行状态</h2><span id="tableCount">8 个节点</span></div><div class="table-wrap"><table><thead><tr><th>节点名称</th><th>节点类型</th><th>所在区域</th><th>连接状态</th><th>链路 / 实时值</th><th>更新时间</th></tr></thead><tbody id="statusTableBody"></tbody></table></div></section>
  </div></main></div>
  <script src="../../../app/config/menu.js"></script><script src="../../../app/components/sidebar.js"></script><script src="../../../app/components/header.js"></script><script src="../../../app/components/drawer.js"></script>
  <script>
    const gatewayNodes=[{id:'core',name:'监控中心平台',type:'core',zone:'中心机房',status:'online',x:450,y:90,value:'12 ms',alarm:''},{id:'gw-f0103',name:'F0103 电力舱网关',type:'gateway',zone:'F0103',status:'online',x:190,y:245,value:'2 ms',alarm:''},{id:'gw-f0104',name:'F0104 燃气舱网关',type:'gateway',zone:'F0104',status:'warn',x:450,y:245,value:'通信质量 82%',alarm:'链路质量下降'},{id:'gw-f0112',name:'F0112 水信舱网关',type:'gateway',zone:'F0112',status:'online',x:710,y:245,value:'3 ms',alarm:''},{id:'edge-a',name:'A 区边缘网关',type:'gateway',zone:'F0116',status:'online',x:320,y:420,value:'1.8 ms',alarm:''},{id:'edge-b',name:'B 区边缘网关',type:'gateway',zone:'F0116',status:'offline',x:585,y:420,value:'46 分钟未心跳',alarm:'网关离线'}];
    const deviceNodes=[{id:'d-env',name:'甲烷探测器 01',type:'device',zone:'F0104',status:'warn',x:185,y:180,value:'42 %LEL',alarm:'甲烷浓度预警'},{id:'d-fire',name:'感烟探测器 08',type:'device',zone:'F0104',status:'online',x:340,y:160,value:'正常',alarm:''},{id:'d-pump',name:'集水井排水泵 02',type:'device',zone:'F0112',status:'fault',x:520,y:360,value:'过载保护',alarm:'设备故障'},{id:'d-video',name:'固定式视频监控 03',type:'device',zone:'F0116',status:'online',x:710,y:180,value:'主码流在线',alarm:''},{id:'d-water',name:'集水井水位传感器',type:'device',zone:'F0112',status:'warn',x:690,y:390,value:'0.60 m',alarm:'高位预警'},{id:'d-door',name:'防火门监控模块',type:'device',zone:'F0103',status:'online',x:170,y:410,value:'闭合',alarm:''},{id:'d-fan',name:'1# 送风机控制柜',type:'device',zone:'F0103',status:'online',x:390,y:410,value:'1,420 r/min',alarm:''}];
    const gatewayLinks=[['core','gw-f0103','good'],['core','gw-f0104','warn'],['core','gw-f0112','good'],['gw-f0103','edge-a','good'],['gw-f0112','edge-b','fault']];
    const deviceLinks=[['gw-f0104','d-env','warn'],['gw-f0104','d-fire','good'],['gw-f0112','d-pump','fault'],['gw-f0112','d-water','warn'],['edge-a','d-video','good'],['gw-f0103','d-door','good'],['gw-f0103','d-fan','good']];
    const statusText={online:'在线 / 正常',warn:'预警',fault:'故障',offline:'离线'}; const typeText={core:'核心节点',gateway:'边缘网关',device:'现场设备'}; const state={tab:'gateway',zone:'all',type:'all',status:'all',selectedId:'core',scale:1};
    function nodes(){return state.tab==='gateway'?gatewayNodes:gatewayNodes.concat(deviceNodes)} function links(){return state.tab==='gateway'?gatewayLinks:gatewayLinks.concat(deviceLinks.filter(l=>nodes().some(n=>n.id===l[0])&&nodes().some(n=>n.id===l[1])))} function filtered(){return nodes().filter(n=>(state.zone==='all'||n.zone===state.zone)&&(state.type==='all'||n.type===state.type)&&(state.status==='all'||n.status===state.status))}
    function renderTopology(){const visible=filtered(), ids=new Set(visible.map(n=>n.id)), svg=document.getElementById('topologyCanvas'); svg.innerHTML=`<g class="links">${links().filter(l=>ids.has(l[0])&&ids.has(l[1])).map(l=>{const a=nodes().find(n=>n.id===l[0]),b=nodes().find(n=>n.id===l[1]);return `<line class="link-line ${l[2]}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`}).join('')}</g><g class="nodes">${visible.map(n=>`<g class="node ${n.status} ${n.id===state.selectedId?'selected':''}" data-node-id="${n.id}" transform="translate(${n.x},${n.y})"><circle class="node-halo" r="${n.alarm?'25':'0'}"/><circle r="22"/><circle class="node-core" r="7"/><text y="42">${n.name}</text><text class="node-id" y="58">${n.zone} · ${n.value}</text></g>`).join('')}</g>`; svg.querySelectorAll('[data-node-id]').forEach(el=>el.addEventListener('click',()=>{state.selectedId=el.dataset.nodeId;renderAll()})); document.getElementById('filterCount').textContent=`${visible.length} 个节点`}
    function renderSummary(){const list=filtered(),online=list.filter(n=>n.status==='online').length,alerts=list.filter(n=>n.alarm).length;document.getElementById('kpiLabel1').textContent=state.tab==='gateway'?'网关总数':'节点总数';document.getElementById('kpiTotal').textContent=list.length;document.getElementById('kpiNote1').textContent=`在线 ${online} · 异常 ${list.length-online}`;document.getElementById('kpiOnline').textContent=`${list.length?Math.round(online/list.length*100):0}%`;document.getElementById('kpiLabel3').textContent=state.tab==='gateway'?'通信链路':'设备连接';document.getElementById('kpiLinks').textContent=links().filter(l=>list.some(n=>n.id===l[0])&&list.some(n=>n.id===l[1])).length;document.getElementById('kpiNote3').textContent='实时质量监测';document.getElementById('kpiAlarms').textContent=alerts}
    function renderDetail(){const n=nodes().find(n=>n.id===state.selectedId)||filtered()[0];const panel=document.getElementById('detailPanel');if(!n){panel.innerHTML='<div class="empty-state">当前筛选条件下暂无节点</div>';return} state.selectedId=n.id;panel.innerHTML=`<div class="detail-hero"><span class="detail-icon"><i class="fa-solid ${n.type==='device'?'fa-microchip':n.type==='core'?'fa-building-columns':'fa-server'}"></i></span><div><strong>${n.name}</strong><small>${n.id} · ${n.zone}</small></div><span class="status-pill ${n.status}">${statusText[n.status]}</span></div><div class="detail-list"><div class="detail-row"><span>节点类型</span><span>${typeText[n.type]}</span></div><div class="detail-row"><span>当前值</span><span>${n.value}</span></div><div class="detail-row"><span>最近心跳</span><span>${n.status==='offline'?'46 分钟前':'3 秒前'}</span></div><div class="detail-row"><span>告警状态</span><span>${n.alarm||'无活动告警'}</span></div></div><button class="btn btn-secondary" id="openDetail" style="width:100%"><i class="fa-solid fa-arrow-up-right-from-square"></i> 查看完整档案</button>`;document.getElementById('openDetail')?.addEventListener('click',()=>window.openAppDrawer?.({title:'节点详情',body:panel.innerHTML,footer:'<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>'}))}
    function renderAlarms(){const list=nodes().filter(n=>n.alarm);document.getElementById('alarmCount').textContent=`${list.length} 条`;document.getElementById('alarmList').innerHTML=list.map(n=>`<button class="alarm-item" data-alarm-id="${n.id}"><strong>${n.alarm}</strong><small>${n.name} · ${n.zone} · 刚刚</small></button>`).join('')||'<div class="empty-state">当前无活动告警</div>';document.querySelectorAll('[data-alarm-id]').forEach(el=>el.addEventListener('click',()=>focusNode(el.dataset.alarmId)))}
    function renderTable(){const list=filtered();document.getElementById('tableTitle').textContent=state.tab==='gateway'?'网关运行状态':'设备运行状态';document.getElementById('tableCount').textContent=`${list.length} 个节点`;document.getElementById('statusTableBody').innerHTML=list.map(n=>`<tr><td><strong>${n.name}</strong></td><td>${typeText[n.type]}</td><td>${n.zone}</td><td><span class="state-text ${n.status}">${statusText[n.status]}</span></td><td>${n.value}</td><td>刚刚</td></tr>`).join('')||'<tr><td colspan="6" class="empty-state">当前筛选条件下暂无节点</td></tr>'}
    function focusNode(id){state.selectedId=id;renderAll();document.getElementById('topologyStage').scrollIntoView({behavior:'smooth',block:'center'})}
    function renderAll(){renderTopology();renderSummary();renderDetail();renderAlarms();renderTable();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',b.dataset.status===state.status));document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===state.type));document.getElementById('configGrid').classList.toggle('is-device',state.tab==='device');document.getElementById('topologyTitle').textContent=state.tab==='gateway'?'网关通信拓扑':'设备运行拓扑';document.getElementById('topologyHint').textContent=state.tab==='gateway'?'中心平台 · 区域网关 · 边缘网关':'网关节点 · 现场设备 · 报警位置'}
    document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.type='all';state.status='all';state.selectedId=state.tab==='gateway'?'core':'d-env';renderAll()}));document.getElementById('zoneFilter').addEventListener('change',e=>{state.zone=e.target.value;renderAll()});document.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{state.status=b.dataset.status;renderAll()}));document.querySelectorAll('[data-type]').forEach(b=>b.addEventListener('click',()=>{state.type=b.dataset.type;renderAll()}));document.getElementById('zoomIn').addEventListener('click',()=>{state.scale=Math.min(1.35,state.scale+.1);document.getElementById('topologyCanvas').style.transform=`scale(${state.scale})`});document.getElementById('zoomOut').addEventListener('click',()=>{state.scale=Math.max(.8,state.scale-.1);document.getElementById('topologyCanvas').style.transform=`scale(${state.scale})`});renderAll()});
  </script>
</body></html>
