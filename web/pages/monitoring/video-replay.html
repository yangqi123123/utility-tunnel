<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>录像回放 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css"><link rel="stylesheet" href="../../assets/css/monitoring.css">
</head>
<body class="monitoring-page" data-menu-key="smart-monitoring.video-replay" data-page-section="智能监测" data-page-title="录像回放">
  <div class="app-shell"><aside id="app-sidebar" class="sidebar"></aside><header id="app-header" class="header"></header>
    <main class="main"><div class="screen-frame stack"><section class="video-replay-workspace">
      <aside class="video-replay-sidebar">
        <div class="video-sidebar-head"><span>监控设备</span><span class="status-muted" id="cameraTotal">12</span></div>
        <div class="video-floor-filter"><label class="form-field"><span class="form-label">选择楼层</span><select class="form-control" id="floorFilter"><option value="all">全部楼层</option><option value="1">1栋</option><option value="2">2栋</option><option value="3">3栋</option><option value="4">4栋</option><option value="5">5栋</option></select></label></div>
        <div class="video-list" id="cameraList"></div>
      </aside>
      <section class="video-replay-content">
        <section class="video-replay-search card">
          <div class="video-replay-search-title"><div><h1 class="card-title">录像回放</h1><span>按时间轴检索历史录像，支持多画面同步回放与关键片段取证</span></div><span class="replay-storage"><i class="fa-solid fa-database"></i> 存储状态：正常</span></div>
          <div class="video-replay-search-fields"><label class="form-field"><span class="form-label">录像日期</span><input class="form-control" id="replayDate" type="date" value="2026-09-04"></label><label class="form-field"><span class="form-label">开始时间</span><input class="form-control" id="startTime" type="time" value="08:00"></label><label class="form-field"><span class="form-label">结束时间</span><input class="form-control" id="endTime" type="time" value="12:00"></label><button class="btn btn-primary" id="searchReplay" type="button"><i class="fa-solid fa-magnifying-glass"></i> 检索录像</button></div>
        </section>
        <section class="video-replay-panel">
          <div class="video-panel-head"><span>历史录像 · <strong id="replayRange">2026-09-04 08:00 - 12:00</strong></span><div class="replay-mode" role="group" aria-label="回放模式"><button class="active" type="button" data-mode="sync"><i class="fa-solid fa-link"></i> 同步回放</button><button type="button" data-mode="async"><i class="fa-solid fa-code-branch"></i> 异步回放</button></div><div class="video-grid-switch" role="group" aria-label="宫格切换"><button type="button" class="active" data-grid="2" title="四宫格"><i class="grid-icon grid-4"><span></span><span></span><span></span><span></span></i></button><button type="button" data-grid="1" title="单画面"><i class="grid-icon grid-1"></i></button><button type="button" data-grid="3" title="九宫格"><i class="grid-icon grid-9"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></i></button></div></div>
          <div class="video-replay-grid" id="replayGrid"></div>
          <div class="video-replay-controls"><button type="button" id="jumpBack" title="后退10秒"><i class="fa-solid fa-backward-step"></i></button><button type="button" class="play-button" id="playToggle" title="播放"><i class="fa-solid fa-play"></i></button><button type="button" id="jumpForward" title="前进10秒"><i class="fa-solid fa-forward-step"></i></button><button type="button" id="frameStep" title="逐帧"><i class="fa-solid fa-forward"></i></button><span class="replay-clock" id="replayClock">09:42:53</span><label class="speed-label">倍速<select id="speedSelect"><option>1x</option><option>2x</option><option>4x</option><option>8x</option><option>16x</option><option>32x</option></select></label><button class="btn btn-secondary mark-button" id="markClip" type="button"><i class="fa-solid fa-bookmark"></i> 标记关键片段</button><button class="btn btn-primary" id="downloadClips" type="button"><i class="fa-solid fa-download"></i> 下载关键录像 <span id="clipCount">0</span></button></div>
          <div class="video-replay-timeline"><div class="timeline-head"><span><i class="fa-solid fa-clock"></i> 录像时间轴</span><span id="timelineStatus">已加载 4 段录像</span></div><div class="timeline-scale"><span>08:00</span><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span></div><div class="timeline-track" id="timelineTrack"><div class="timeline-segment segment-a" data-time="08:36:00" title="08:36 - 09:18"></div><div class="timeline-segment segment-b" data-time="09:42:53" title="09:42 - 10:26"></div><div class="timeline-segment segment-c" data-time="10:48:00" title="10:48 - 11:20"></div><div class="timeline-segment segment-d" data-time="11:36:00" title="11:36 - 11:58"></div><div class="timeline-marker" id="timelineMarker"></div></div><div class="timeline-events"><span><i class="fa-solid fa-circle" style="color:#2f80ed"></i> 普通录像</span><span><i class="fa-solid fa-circle" style="color:#f59e0b"></i> 事件录像</span><span><i class="fa-solid fa-bookmark"></i> 已标记片段</span></div></div>
        </section>
      </section>
    </section></div></main>
  </div>
  <script src="../../../app/config/menu.js"></script><script src="../../../app/components/sidebar.js"></script><script src="../../../app/components/header.js"></script><script src="../../../app/components/drawer.js"></script><script src="../../../app/components/requirement.js"></script>
  <script>
    const cameras=[{name:'屋面电梯机房门口',floor:'5',event:true},{name:'35层VIP电梯厅',floor:'5'},{name:'B1东侧入口道闸',floor:'1'},{name:'西侧出口道闸',floor:'1'},{name:'3号楼大厅',floor:'3'},{name:'2号楼地下车库',floor:'2'},{name:'4号楼消防通道',floor:'4'},{name:'1号楼消防通道',floor:'1'},{name:'2号楼电梯厅',floor:'2'}];
    const image='../../assets/images/access-gate.jpg'; let visible=[...cameras], grid=2, page=0, playing=false, marker=43, marked=[];
    const $=id=>document.getElementById(id);
    function renderList(){ $('cameraList').innerHTML=visible.map((c,i)=>`<button class="video-list-item ${i===0?'active':''}" data-camera="${i}"><i class="fa-solid fa-video"></i><span>${c.name}</span><small>有录像</small></button>`).join(''); }
    function renderGrid(){ const size=grid===1?1:grid===2?4:9; const cols=grid===1?1:grid===2?2:3; const items=visible.slice(page*size,page*size+size); $('replayGrid').style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`; $('replayGrid').innerHTML=items.map((c,i)=>`<div class="video-replay-feed"><div class="video-feed-title"><span>${c.name}</span><span><i class="fa-solid fa-circle-dot"></i> ${c.event?'事件录像':'有录像'}</span></div><div class="video-screen"><img src="${image}" alt="${c.name}历史录像"><span class="replay-feed-time">2026-09-04 ${$('replayClock').textContent}</span><button class="feed-mark ${marked.includes(c.name)?'active':''}" data-mark-camera="${c.name}" title="标记关键片段"><i class="fa-solid fa-bookmark"></i></button></div></div>`).join(''); }
    function setClock(seconds){ marker=seconds; const h=String(Math.floor(seconds/3600)+8).padStart(2,'0'),m=String(Math.floor(seconds%3600/60)).padStart(2,'0'),s=String(Math.floor(seconds%60)).padStart(2,'0'); $('replayClock').textContent=`${h}:${m}:${s}`; $('timelineMarker').style.left=`${Math.min(99,Math.max(0,(seconds/14400)*100))}%`; document.querySelectorAll('.replay-feed-time').forEach(x=>x.textContent=`2026-09-04 ${$('replayClock').textContent}`); }
    function filterFloor(){ const v=$('floorFilter').value; visible=v==='all'?[...cameras]:cameras.filter(c=>c.floor===v); page=0; renderList(); renderGrid(); }
    $('floorFilter').addEventListener('change',filterFloor); $('searchReplay').addEventListener('click',()=>{ $('replayRange').textContent=`${$('replayDate').value} ${$('startTime').value} - ${$('endTime').value}`; $('timelineStatus').textContent='已加载 4 段录像'; window.showToast?.('检索完成，已找到 4 段录像'); });
    document.addEventListener('click',e=>{ const g=e.target.closest('[data-grid]'); if(g){grid=Number(g.dataset.grid);document.querySelectorAll('[data-grid]').forEach(x=>x.classList.toggle('active',x===g));renderGrid();} const mode=e.target.closest('[data-mode]'); if(mode){document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===mode));document.querySelector('.video-replay-panel').dataset.mode=mode.dataset.mode;} const seg=e.target.closest('.timeline-segment'); if(seg){setClock(seg.dataset.time.split(':').reduce((a,v)=>a*60+Number(v),0)-8*3600); $('timelineStatus').textContent=`已定位至 ${seg.dataset.time}`;} const mark=e.target.closest('[data-mark-camera]'); if(mark){const n=mark.dataset.markCamera;marked=marked.includes(n)?marked.filter(x=>x!==n):[...marked,n];$('clipCount').textContent=marked.length;renderGrid();} if(e.target.closest('#markClip')){marked=[...new Set([...marked,visible[0]?.name||'屋面电梯机房门口'])];$('clipCount').textContent=marked.length;renderGrid();} if(e.target.closest('#downloadClips')){window.openAppDrawer?.({title:'下载关键录像',subtitle:'录像回放 · 取证下载',body:`<p>已选中 <strong>${marked.length||1}</strong> 个关键录像片段，将生成 MP4 文件下载任务。</p><p class="text-muted">任务创建后可在下载中心查看进度。</p>`,footer:'<button class="btn btn-secondary" data-drawer-close>取消</button><button class="btn btn-primary" data-drawer-close>创建下载任务</button>'});} if(e.target.closest('#playToggle')){playing=!playing;$('playToggle').innerHTML=`<i class="fa-solid fa-${playing?'pause':'play'}"></i>`;$('playToggle').title=playing?'暂停':'播放';} if(e.target.closest('#jumpBack'))setClock(Math.max(0,marker-10)); if(e.target.closest('#jumpForward'))setClock(marker+10); if(e.target.closest('#frameStep'))setClock(marker+1); });
    $('timelineTrack').addEventListener('click',e=>{if(e.target.closest('.timeline-segment'))return; const r=e.currentTarget.getBoundingClientRect(); marker=Math.round((e.clientX-r.left)/r.width*14400);setClock(marker);});
    renderList();renderGrid();setClock(1*3600+42*60+53);
  </script>
</body></html>
