<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>环境监测系统 - 科学岛管廊监控中心</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/tob-ui.css">
  <link rel="stylesheet" href="../../assets/css/environment-monitor.css">
</head>
<body class="environment-page" data-menu-key="environment-monitoring" data-page-section="子系统" data-page-title="环境监测系统">
  <div class="app-shell">
    <aside id="app-sidebar" class="sidebar"></aside>
    <header id="app-header" class="header"></header>
    <main class="main"><div class="screen-frame stack">
      <section class="environment-stat-grid" aria-label="环境监测概览"><article class="environment-stat"><span class="environment-stat-label">监测点总数</span><strong id="statTotal">128</strong><small>环境质量与机电参数</small><i class="environment-stat-icon fa-solid fa-satellite-dish"></i></article><article class="environment-stat success"><span class="environment-stat-label">在线率</span><strong id="statOnline">97.6%</strong><small>125 个点位正常通信</small><i class="environment-stat-icon fa-solid fa-link"></i></article><article class="environment-stat warning"><span class="environment-stat-label">当前超限</span><strong id="statWarning">4</strong><small>2 条高风险 · 2 条预警</small><i class="environment-stat-icon fa-solid fa-triangle-exclamation"></i></article><article class="environment-stat danger"><span class="environment-stat-label">今日告警</span><strong id="statAlarm">18</strong><small>已恢复 12 条</small><i class="environment-stat-icon fa-solid fa-bell"></i></article></section>
      <section class="card environment-filter-card"><div class="filter-actions environment-filter-row"><label class="form-field"><span class="form-label">关键词</span><input class="form-control" data-filter="keyword" placeholder="设备名称 / 参数名称 / 编码"></label><label class="form-field"><span class="form-label">监测类别</span><select class="form-control" data-filter="category"><option value="">全部类别</option><option value="环境质量">环境质量</option><option value="通风系统">通风系统</option><option value="排水系统">排水系统</option><option value="照明系统">照明系统</option><option value="供配电系统">供配电系统</option></select></label><label class="form-field"><span class="form-label">状态</span><select class="form-control" data-filter="status"><option value="">全部状态</option><option value="normal">正常</option><option value="warning">预警</option><option value="danger">严重超限</option><option value="offline">离线</option></select></label><label class="form-field"><span class="form-label">位置</span><select class="form-control" data-filter="zone"><option value="">全部位置</option><option value="一号舱 · 东段">一号舱 · 东段</option><option value="一号舱 · 西段">一号舱 · 西段</option><option value="二号舱 · 东段">二号舱 · 东段</option><option value="二号舱 · 西段">二号舱 · 西段</option></select></label><button class="btn btn-secondary" type="button" data-action="reset">重置</button><button class="btn btn-primary" type="button" data-action="search"><i class="fa-solid fa-magnifying-glass"></i>查询</button></div></section>
      <section class="environment-workspace"><article class="card environment-table-card"><div class="card-title-row"><div><h2 class="card-title">监测参数列表</h2></div><span class="read-only-tag"><i class="fa-solid fa-eye"></i>只读</span></div><div class="table-wrap"><table class="table environment-table"><thead><tr><th>监测参数</th><th>监测类别</th><th>当前位置</th><th>当前值</th><th>阈值范围</th><th>状态</th><th>更新时间</th></tr></thead><tbody id="environmentTableBody"></tbody></table></div><div class="environment-pagination"><span>共 <strong id="recordCount">0</strong> 条监测记录</span><span class="page-item active">1</span></div></article><aside class="environment-side-stack"><article class="card environment-side-card"><div class="card-title-row"><div><h2 class="card-title">超限告警</h2><span class="card-caption">需要优先关注的实时异常</span></div><span class="tag tag-danger" id="alertCount">6 条</span></div><div class="alert-list" id="alertList"></div></article><article class="card environment-side-card"><div class="card-title-row"><div><h2 class="card-title">分类概览</h2><span class="card-caption">当前监测点分布</span></div></div><div class="category-list" id="categoryList"></div></article></aside></section>
    </div></main>
  </div>
  <script src="../../../app/config/menu.js?v=nav-hide-1"></script><script src="../../../app/components/sidebar.js?v=nav-home-1"></script><script src="../../../app/components/header.js?v=nav-home-1"></script><script src="../../../app/components/drawer.js"></script>
  <script>
    const monitorRecords = [
      { id:"ENV-AIR-001", name:"温度", device:"一号舱温湿度传感器 01", category:"环境质量", categoryKey:"air", zone:"一号舱 · 东段", value:"26.4", unit:"℃", threshold:"5 ~ 35 ℃", status:"normal", time:"刚刚", icon:"fa-temperature-half", note:"温度处于舒适运行区间，暂无异常趋势。" },
      { id:"ENV-AIR-002", name:"甲烷浓度", device:"一号舱可燃气体探测器 03", category:"环境质量", categoryKey:"air", zone:"一号舱 · 西段", value:"42", unit:"%LEL", threshold:"≤ 25 %LEL", status:"danger", time:"12 秒前", icon:"fa-cloud", note:"甲烷浓度超过预警阈值，已同步至报警中心。" },
      { id:"ENV-AIR-003", name:"氧气浓度", device:"二号舱气体检测仪 02", category:"环境质量", categoryKey:"air", zone:"二号舱 · 东段", value:"19.8", unit:"%VOL", threshold:"19.5 ~ 23.5", status:"normal", time:"刚刚", icon:"fa-wind", note:"氧气浓度正常。" },
      { id:"ENV-VENT-001", name:"送风机运行状态", device:"1# 送风机控制柜", category:"通风系统", categoryKey:"vent", zone:"一号舱 · 东段", value:"运行", unit:"1,420 r/min", threshold:"运行 / 停止", status:"normal", time:"8 秒前", icon:"fa-fan", note:"送风机运行状态由通风控制系统同步。" },
      { id:"ENV-VENT-002", name:"舱内风速", device:"二号舱风速传感器 01", category:"通风系统", categoryKey:"vent", zone:"二号舱 · 西段", value:"0.18", unit:"m/s", threshold:"≥ 0.20 m/s", status:"warning", time:"18 秒前", icon:"fa-wind", note:"当前风速略低于设定阈值，建议关注送风机负载。" },
      { id:"ENV-WATER-001", name:"集水井水位", device:"一号舱集水井液位计 01", category:"排水系统", categoryKey:"water", zone:"一号舱 · 东段", value:"0.60", unit:"m", threshold:"≤ 0.80 m", status:"warning", time:"5 秒前", icon:"fa-water", note:"水位达到预警线，排水泵已自动投入。" },
      { id:"ENV-WATER-002", name:"排水泵运行状态", device:"2# 集水井排水泵", category:"排水系统", categoryKey:"water", zone:"二号舱 · 东段", value:"故障", unit:"过载保护", threshold:"运行 / 停止", status:"danger", time:"1 分钟前", icon:"fa-pump-soap", note:"排水泵出现过载保护，需现场复核设备状态。" },
      { id:"ENV-LIGHT-001", name:"照度", device:"一号舱照明回路 04", category:"照明系统", categoryKey:"light", zone:"一号舱 · 西段", value:"186", unit:"lx", threshold:"≥ 150 lx", status:"normal", time:"25 秒前", icon:"fa-lightbulb", note:"照度满足运行照明要求。" },
      { id:"ENV-LIGHT-002", name:"应急照明状态", device:"二号舱应急照明回路 02", category:"照明系统", categoryKey:"light", zone:"二号舱 · 西段", value:"正常", unit:"在线", threshold:"在线", status:"normal", time:"40 秒前", icon:"fa-lightbulb", note:"应急照明回路在线。" },
      { id:"ENV-POWER-001", name:"低压进线电流", device:"1# 变电所低压进线柜", category:"供配电系统", categoryKey:"power", zone:"一号舱 · 东段", value:"186.4", unit:"A", threshold:"≤ 250 A", status:"normal", time:"6 秒前", icon:"fa-bolt", note:"进线电流处于正常负载范围。" },
      { id:"ENV-POWER-002", name:"配电柜通信状态", device:"二号舱配电柜通信网关", category:"供配电系统", categoryKey:"power", zone:"二号舱 · 西段", value:"离线", unit:"46 分钟", threshold:"在线", status:"offline", time:"46 分钟前", icon:"fa-plug-circle-xmark", note:"第三方网关长时间未上报数据，请检查链路与供电。" }
    ];
    const state = { filters:{ keyword:"", category:"", status:"", zone:"" } };
    const statusText = { normal:"正常", warning:"预警", danger:"严重超限", offline:"离线" };
    const categoryMeta = { "环境质量":["fa-leaf"], "通风系统":["fa-fan"], "排水系统":["fa-water"], "照明系统":["fa-lightbulb"], "供配电系统":["fa-bolt"] };
    function filteredRecords(){ const {keyword,category,status,zone}=state.filters; const query=keyword.toLowerCase(); return monitorRecords.filter((item)=>(!query||`${item.id}${item.name}${item.device}`.toLowerCase().includes(query))&&(!category||item.category===category)&&(!status||item.status===status)&&(!zone||item.zone===zone)); }
    function renderStats(list){ const alerts=monitorRecords.filter((item)=>item.status==="warning"||item.status==="danger").length; document.getElementById("statTotal").textContent=128; document.getElementById("statOnline").textContent="97.6%"; document.getElementById("statWarning").textContent=alerts; document.getElementById("statAlarm").textContent=18; document.getElementById("alertCount").textContent=`${alerts} 条`; document.getElementById("recordCount").textContent=list.length; }
    function renderTable(list){ document.getElementById("environmentTableBody").innerHTML=list.map((item)=>`<tr class="row-${item.status}" data-record-id="${item.id}"><td class="parameter-cell"><strong>${item.name}</strong><small>${item.device} · ${item.id}</small></td><td><span class="category-tag ${item.categoryKey}">${item.category}</span></td><td>${item.zone}</td><td class="value-cell"><strong>${item.value}</strong><small>${item.unit}</small></td><td class="threshold-cell">${item.threshold}</td><td><span class="env-status ${item.status}">${statusText[item.status]}</span></td><td>${item.time}</td></tr>`).join("")||`<tr><td colspan="7" class="empty-state">当前筛选条件下暂无监测记录</td></tr>`; }
    function renderAlerts(){ const alerts=monitorRecords.filter((item)=>item.status==="warning"||item.status==="danger"); document.getElementById("alertList").innerHTML=alerts.map((item)=>`<button type="button" class="alert-item" data-record-id="${item.id}"><span class="alert-severity ${item.status==="warning"?"warning":""}"><i class="fa-solid ${item.status==="danger"?"fa-fire":"fa-triangle-exclamation"}"></i></span><span><strong class="alert-title">${item.name} · ${item.zone}</strong><small class="alert-meta">${item.device} · ${item.time}</small></span><span class="alert-value">${item.value} ${item.unit}</span></button>`).join(""); }
    function renderCategories(){ const counts=monitorRecords.reduce((map,item)=>(map[item.category]=(map[item.category]||0)+1,map),{}); document.getElementById("categoryList").innerHTML=Object.entries(categoryMeta).map(([name,[icon]])=>`<div class="category-item"><span class="category-icon"><i class="fa-solid ${icon}"></i></span><span class="category-main"><strong>${name}</strong><small>${name==="环境质量"?"温湿度 / 气体 / 风速":name==="通风系统"?"风机 / 风速 / 压差":name==="排水系统"?"水位 / 水泵 / 阀门":name==="照明系统"?"照度 / 回路 / 应急":"电流 / 电压 / 通信"}</small></span><strong class="category-count">${counts[name]||0}</strong></div>`).join(""); }
    function render(){ const list=filteredRecords(); renderStats(list); renderTable(list); renderAlerts(); renderCategories(); }
    function trendSvg(item){ const color=item.status==="danger"?"#f53f57":item.status==="warning"?"#f7ba1e":"#135afa"; return `<svg viewBox="0 0 520 140" preserveAspectRatio="none"><path d="M0 112H520M0 76H520M0 40H520" stroke="#e5eaf3"/><path d="M0 94 C34 84 58 101 86 82 S138 54 168 73 S228 98 256 64 S308 52 340 76 S394 94 430 66 S484 70 520 42" fill="none" stroke="${color}" stroke-width="3"/><circle cx="520" cy="42" r="5" fill="${color}"/><text x="4" y="132" fill="#86909c" font-size="10">-30 min</text><text x="466" y="132" fill="#86909c" font-size="10">现在</text></svg>`; }
    function openDetail(id){ const item=monitorRecords.find((entry)=>entry.id===id); if(!item)return; const body=`<div class="environment-detail"><div class="environment-detail-hero"><span class="environment-detail-icon"><i class="fa-solid ${item.icon}"></i></span><div><strong>${item.name}</strong><small>${item.device} · ${item.id}</small></div><span class="env-status ${item.status}">${statusText[item.status]}</span></div><section class="environment-detail-section"><h3>当前参数</h3><div class="environment-detail-grid"><div class="info-item"><span class="info-label">监测类别</span><span class="info-value">${item.category}</span></div><div class="info-item"><span class="info-label">安装位置</span><span class="info-value">${item.zone}</span></div><div class="info-item"><span class="info-label">当前值</span><span class="info-value">${item.value} ${item.unit}</span></div><div class="info-item"><span class="info-label">阈值范围</span><span class="info-value">${item.threshold}</span></div><div class="info-item"><span class="info-label">数据来源</span><span class="info-value">第三方环境监测平台</span></div><div class="info-item"><span class="info-label">最近同步</span><span class="info-value">${item.time}</span></div></div></section><section class="environment-detail-section"><h3>近 30 分钟趋势</h3><div class="environment-detail-chart">${trendSvg(item)}</div></section><section class="environment-detail-section"><h3>告警说明</h3><p class="environment-detail-note">${item.note}</p></section></div>`; window.openAppDrawer({ title:"监测参数详情", subtitle:`${item.category} · 只读数据`, body, footer:`<button class="btn btn-secondary" type="button" data-drawer-close>关闭</button>` }); }
    function syncFilters(){ document.querySelectorAll("[data-filter]").forEach((field)=>{ state.filters[field.dataset.filter]=field.value.trim(); }); render(); }
    document.addEventListener("click",(event)=>{ const action=event.target.closest("[data-action]")?.dataset.action; if(action==="search")syncFilters(); if(action==="reset"){ document.querySelectorAll("[data-filter]").forEach((field)=>{field.value="";}); state.filters={keyword:"",category:"",status:"",zone:""}; render(); } if(action==="refresh"){ const syncEl=document.getElementById("lastSync"); if(syncEl)syncEl.textContent="刚刚"; render(); } const record=event.target.closest("[data-record-id]"); if(record)openDetail(record.dataset.recordId); });
    document.addEventListener("keydown",(event)=>{ if(event.key==="Enter"&&event.target.matches('[data-filter="keyword"]'))syncFilters(); });
    render();
  </script>
</body>
</html>
